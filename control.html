<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Judo Score – Control</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #232327;
      color: #fafafa;
      overflow: hidden;
      --c2-bg: #d42a2a;
      --c2-fg: #ffffff;
      --c2-accent: #f87171;
    }
    body[data-theme="blue"] {
      --c2-bg: #1e5fd9;
      --c2-fg: #ffffff;
      --c2-accent: #60a5fa;
    }

    /* white / red fill the screen */
    .board {
      position: absolute;
      inset: 0;
      display: flex;
      gap: 22px;
      padding: 40px;
    }
    .panel {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1.1rem;
      padding: 305px 3.5vw 110px;   /* keep content clear of the notches */
      border-radius: 24px;
      transition: box-shadow .15s, opacity .15s;
    }
    .panel.white { background: #f4f4f5; color: #18181b; align-items: flex-end; }
    .panel.red   { background: var(--c2-bg); color: var(--c2-fg); align-items: flex-start; }
    .panel.won  { box-shadow: inset 0 0 0 5px #f4c20d; }
    .panel.lost { opacity: .4; }

    /* score + WIN badge share a box so the badge can float without shifting layout */
    .scorebox { position: relative; display: flex; flex-direction: column; align-items: center; }
    .winbadge {
      position: absolute;
      bottom: calc(100% + .3rem);
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-weight: 800;
      font-size: 3rem;
      letter-spacing: .28em;
      text-indent: .28em;
      line-height: 1;
      visibility: hidden;
    }
    .panel.won .winbadge { visibility: visible; }
    .panel.won .fname   { visibility: hidden; }   /* WIN takes the name's place */

    .fname {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      opacity: .55;
      cursor: pointer;
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
    }
    .fname:hover { opacity: .8; text-decoration: underline dotted; }
    .pscore {
      font-size: clamp(4rem, 12vw, 9rem);
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      user-select: none;
    }
    .pscore.win { font-size: clamp(2.6rem, 6.5vw, 4.6rem); }

    /* shido (penalty) circles */
    .shido { display: flex; align-items: center; gap: .4rem; }
    .shido i {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 3px solid currentColor;
      opacity: .35;
    }
    .shido i.on { opacity: 1; background: #f4c20d; border-color: #f4c20d; }

    /* doctor-intervention counter (square, red) */
    .med { display: flex; align-items: center; gap: .4rem; }
    .shidolbl,
    .medlbl { font-size: .62rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .45; }
    .med i {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: 3px solid currentColor;
      opacity: .3;
    }
    .med i.on { opacity: 1; background: #ef4444; border-color: #ef4444; }

    .scores { display: flex; gap: .6rem; flex-wrap: wrap; justify-content: center; }
    /* mirror the two sides: Yuko sits innermost (toward the seam), Ippon outermost */
    .panel.white .scores { flex-direction: row-reverse; }
    .sbtn {
      border: none;
      border-radius: 16px;
      cursor: pointer;
      padding: .7rem 1.1rem;
      min-width: 108px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .15rem;
      font-weight: 700;
    }
    .sbtn .sname { font-size: 1.05rem; }
    .sbtn .spts  { font-size: .8rem; opacity: .65; font-weight: 600; }
    .panel.white .sbtn { background: #18181b; color: #f4f4f5; }
    .panel.red   .sbtn { background: #ffffff; color: var(--c2-bg); }

    .ctrls { display: flex; gap: .5rem; flex-wrap: wrap; }
    .panel.white .ctrls { flex-direction: row-reverse; }
    .panel.red   .ctrls { justify-content: flex-start; }
    .panel.white .ctrls { justify-content: flex-end; }
    .ctrls button {
      border: none;
      border-radius: 999px;
      padding: .4rem 1.1rem;
      font-size: .85rem;
      cursor: pointer;
      color: inherit;
      background: rgba(0, 0, 0, .12);
    }
    .panel.red .ctrls button { background: rgba(255, 255, 255, .22); }
    .ctrls button.armed { background: #f4c20d !important; color: #18181b; font-weight: 700; }

    /* the cut-out notch carrying both clocks + osae-komi controls */
    .notch {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      background: #232327;
      border-radius: 0 0 30px 30px;
      padding: 30px 34px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .timer {
      font-size: 6rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: .05em;
      padding: .1em .6em;
      border-radius: 20px;
      background: #18181b;
      border: 3px solid #3f3f46;
      cursor: pointer;
      user-select: none;
      transition: color .15s, border-color .15s;
      box-sizing: border-box;
      min-width: 4.2em;          /* fixed footprint so the notch never reflows */
      text-align: center;
    }
    .timer.stopped { color: #fafafa; }
    .timer.running { color: #4ade80; border-color: #4ade80; }
    .timer.done    { color: #f87171; border-color: #f87171; }
    .timer.golden  { color: #f4c20d; border-color: #f4c20d; }

    .oktime {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: #18181b;
      border: 3px solid #3f3f46;
      border-radius: 14px;
      padding: .06em .8em .12em;
      min-width: 108px;
      cursor: pointer;
      user-select: none;
    }
    .oktime b { font-size: 2.3rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .oktime small {
      font-size: .64rem;
      letter-spacing: .15em;
      font-weight: 700;
      height: .9rem;
      line-height: .9rem;
      overflow: hidden;
      color: #fbbf24;
    }
    .oktime.run      { border-color: #fbbf24; }
    .oktime.paused   { border-color: #fbbf24; border-style: dashed; }
    .oktime.white    { border-color: #f4f4f5; }
    .oktime.red      { border-color: var(--c2-accent); }

    /* one Osae-komi clock flanked by assign arrows */
    .okrow { display: flex; align-items: stretch; gap: 8px; visibility: hidden; }
    .okrow.live { visibility: visible; }
    .okstop.gone { visibility: hidden; }
    .okarrow {
      border: 2px solid #3f3f46;
      background: #18181b;
      color: #9a9aa2;
      border-radius: 12px;
      padding: 0 .7rem;
      font-size: 1.1rem;
      cursor: pointer;
      transition: transform .1s;
    }
    .okarrow.armed { border-color: #fbbf24; color: #fbbf24; animation: pulse 1s ease-in-out infinite; }
    .okarrow.active[data-side="white"] { background: #f4f4f5; color: #18181b; border-color: #f4f4f5; }
    .okarrow.active[data-side="red"]   { background: var(--c2-bg); color: var(--c2-fg); border-color: var(--c2-bg); }
    .okarrow:disabled { opacity: .3; cursor: default; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }

    .okctrl { display: flex; flex-direction: column; align-items: center; gap: .5rem; }
    .okstop, .okcancel {
      border: none;
      border-radius: 12px;
      padding: .5rem 1.4rem;
      cursor: pointer;
      font-weight: 700;
      font-size: .85rem;
      background: #3f3f46;
      color: #fafafa;
    }
    .okstop {
      background: #4ade80;
      color: #052e12;
      padding: 1.15rem 3.2rem;
      font-size: 1.6rem;
      border-radius: 16px;
    }
    .okstop:disabled { opacity: .4; cursor: default; }

    /* per-element help: hover any control to see what it does */
    [data-tip] { position: relative; }
    [data-tip]::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: 250px;
      background: #0b0b0d;
      color: #e4e4e7;
      border: 1px solid #52525b;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: .72rem;
      font-weight: 500;
      line-height: 1.45;
      letter-spacing: normal;
      text-transform: none;
      text-align: center;
      white-space: normal;
      opacity: 0;
      pointer-events: none;
      transition: opacity .1s ease 0s;   /* hide immediately when the mouse leaves */
      z-index: 60;
    }
    [data-tip]:hover::after { opacity: 1; transition-delay: .7s; }   /* only after resting on the spot */
    /* controls in the top notch: show the tip below instead of above */
    .notch [data-tip]::after { bottom: auto; top: calc(100% + 8px); }
    /* bottom notch sits at the screen edge: keep its tip above */
    .notch.bottom [data-tip]::after { top: auto; bottom: calc(100% + 8px); }

    /* golden score: the grey seam / notch turns gold */
    body.golden,
    body.golden .notch { background: #d9b43c; }

    .phaselabel {
      position: absolute;
      top: 7px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: .95rem;
      font-weight: 800;
      letter-spacing: .2em;
      color: #f4c20d;
    }

    /* hantei (referee decision) picker */
    .hantei { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .hantei .htitle { font-size: .78rem; font-weight: 800; letter-spacing: .18em; color: #f4c20d; }
    .harrows { display: flex; gap: 16px; }
    .harrow {
      border: 2px solid #3f3f46;
      background: #18181b;
      color: #9a9aa2;
      border-radius: 12px;
      padding: .3rem 1.5rem;
      font-size: 1.6rem;
      cursor: pointer;
      transition: transform .1s;
    }
    .harrow:hover { transform: scale(1.06); }
    .harrow[data-side="white"].chosen { background: #f4f4f5; color: #18181b; border-color: #f4f4f5; }
    .harrow[data-side="red"].chosen   { background: var(--c2-bg); color: var(--c2-fg); border-color: var(--c2-bg); }

    .gschk {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: .78rem;
      font-weight: 700;
      color: #fafafa;
      cursor: pointer;
    }

    .openbtn {
      position: absolute;
      right: 16px;
      bottom: 14px;
      z-index: 6;
      background: #38bdf8;
      color: #08263a;
      border: none;
      border-radius: 10px;
      padding: .5rem 1.1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .notch.bottom {
      top: auto;
      bottom: 0;
      border-radius: 30px 30px 0 0;
      padding: 14px 34px 16px;
    }
    .nextbtn {
      background: #e5e5e5;
      color: #18181b;
      border: 2px solid #e5e5e5;
      border-radius: 10px;
      padding: .6rem 1.8rem;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
    }
    .nextbtn.armed { background: #f4c20d; border-color: #f4c20d; }
    .nextbtn.queued { box-shadow: 0 0 0 3px #38bdf8; }
    .nextbtn.queued::before { content: "\00BB\00A0"; color: #0369a1; }

    .presets {
      position: absolute;
      left: 16px;
      bottom: 14px;
      z-index: 6;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .topright {
      position: absolute;
      right: 16px;
      top: 14px;
      z-index: 6;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .topright .ticon {
      background: #18181b;
      color: #fafafa;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      width: 34px;
      height: 34px;
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
      padding: 0;
    }
    .topright .ticon.off { color: #71717a; }
    .presets .plabel { font-size: .74rem; color: #8b8b93; font-weight: 700; }
    .presets select,
    .topright select {
      background: #18181b;
      color: #fafafa;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      padding: .4rem .5rem;
      font-size: .82rem;
      max-width: 150px;
    }
    .presets button {
      background: #3f3f46;
      color: #fafafa;
      border: none;
      border-radius: 8px;
      padding: .4rem .6rem;
      font-size: .78rem;
      font-weight: 700;
      cursor: pointer;
    }
    .presets button:disabled { opacity: .35; cursor: default; }

    .pf input[type="text"] { width: 150px; }

    .pop {
      position: fixed;
      z-index: 50;
      width: 232px;
      background: #18181b;
      color: #fafafa;
      border: 1px solid #3f3f46;
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .55);
    }
    .pop h4 { margin: 0 0 10px; font-size: .9rem; font-weight: 600; }
    .pf { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin-bottom: .45rem; }
    .pf span { font-size: .85rem; }
    .pf input {
      width: 84px;
      padding: .4rem .5rem;
      border-radius: 8px;
      border: 1px solid #3f3f46;
      background: #232327;
      color: #fafafa;
      font-size: 1rem;
    }
    .pop .row { display: flex; gap: .5rem; margin-top: 12px; }
    .pop .row button { flex: 1; border: none; border-radius: 8px; padding: .5rem; cursor: pointer; font-weight: 600; }
    .pop .save   { background: #4ade80; color: #052e12; }
    .pop .cancel { background: #3f3f46; color: #fafafa; }

    /* keyboard-shortcut overview */
    .help {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(0, 0, 0, .6);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .helpcard {
      background: #18181b;
      color: #fafafa;
      border: 1px solid #3f3f46;
      border-radius: 16px;
      padding: 22px 26px;
      width: 90%;
      max-width: 460px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, .6);
    }
    .helpcard h3 { margin: 0 0 14px; font-size: 1.1rem; letter-spacing: .04em; }
    .helpcard table { width: 100%; border-collapse: collapse; }
    .helpcard td { padding: 5px 0; font-size: .85rem; vertical-align: top; }
    .helpcard td:first-child {
      white-space: nowrap;
      padding-right: 18px;
      font-weight: 700;
      color: #f4c20d;
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
    }
    .helpcard button {
      margin-top: 16px;
      width: 100%;
      background: #3f3f46;
      color: #fafafa;
      border: none;
      border-radius: 8px;
      padding: .55rem;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="board">
    <section class="panel white" data-side="white">
      <div class="fname" data-fname="white" data-i18n-tip="tipFname">Kämpfer 1</div>
      <div class="scorebox">
        <div class="winbadge" data-i18n="win">SIEG</div>
        <div class="pscore" data-score="white" data-i18n-tip="tipScoreNum">0</div>
      </div>
      <div class="shido" data-side="white" data-key="Q" data-i18n-tip="tipShido"><span class="shidolbl" data-i18n="shidoLabel">Shido</span><i></i><i></i><i></i></div>
      <div class="med" data-side="white" data-i18n-tip="tipMed"><span class="medlbl" data-i18n="medLabel">Arzt</span><i></i><i></i><i></i></div>
      <div class="scores" data-side="white"></div>
      <div class="ctrls">
        <button data-act="undo" data-side="white" data-key="W" data-i18n="undo" data-i18n-tip="tipUndo">Rückgängig</button>
        <button data-act="reset" data-side="white" data-i18n="reset" data-i18n-tip="tipReset">Reset</button>
        <button data-act="hansoku" data-side="white" data-i18n="hansoku" data-i18n-tip="tipHansoku">Hansoku-make</button>
        <button data-act="kiken" data-side="white" data-i18n="kiken" data-i18n-tip="tipKiken">Kiken</button>
      </div>
    </section>

    <section class="panel red" data-side="red">
      <div class="fname" data-fname="red" data-i18n-tip="tipFname">Kämpfer 2</div>
      <div class="scorebox">
        <div class="winbadge" data-i18n="win">SIEG</div>
        <div class="pscore" data-score="red" data-i18n-tip="tipScoreNum">0</div>
      </div>
      <div class="shido" data-side="red" data-key="P" data-i18n-tip="tipShido"><span class="shidolbl" data-i18n="shidoLabel">Shido</span><i></i><i></i><i></i></div>
      <div class="med" data-side="red" data-i18n-tip="tipMed"><span class="medlbl" data-i18n="medLabel">Arzt</span><i></i><i></i><i></i></div>
      <div class="scores" data-side="red"></div>
      <div class="ctrls">
        <button data-act="undo" data-side="red" data-key="O" data-i18n="undo" data-i18n-tip="tipUndo">Rückgängig</button>
        <button data-act="reset" data-side="red" data-i18n="reset" data-i18n-tip="tipReset">Reset</button>
        <button data-act="hansoku" data-side="red" data-i18n="hansoku" data-i18n-tip="tipHansoku">Hansoku-make</button>
        <button data-act="kiken" data-side="red" data-i18n="kiken" data-i18n-tip="tipKiken">Kiken</button>
      </div>
    </section>
  </div>

  <div class="notch">
    <div id="phaseLabel" class="phaselabel"></div>
    <div id="timer" class="timer stopped" data-i18n-tip="tipTimer">2:30</div>

    <div id="hantei" class="hantei" hidden>
      <div class="htitle" data-i18n="hanteiPick">HANTEI — Sieger wählen</div>
      <div class="harrows">
        <button class="harrow" data-side="white" data-i18n-tip="tipHanteiWhite">&#9664;</button>
        <button class="harrow" data-side="red" data-i18n-tip="tipHanteiRed">&#9654;</button>
      </div>
    </div>

    <div class="okrow">
      <button class="okarrow" data-side="white" data-i18n-tip="tipOkArrowWhite">&#9664;</button>
      <div id="oktime" class="oktime" data-i18n-tip="tipOktime">
        <b id="okElapsed">0</b>
        <small id="okAward"></small>
      </div>
      <button class="okarrow" data-side="red" data-i18n-tip="tipOkArrowRed">&#9654;</button>
    </div>

    <div class="okctrl">
      <button id="okStart" class="okstop" data-i18n="osaekomi" data-i18n-tip="tipOkStart">Osae-komi</button>
      <button id="okCancel" class="okcancel" data-i18n="cancel" data-i18n-tip="tipOkCancel">Abbrechen</button>
    </div>
  </div>

  <div class="topright">
    <select id="langSel" data-i18n-tip="tipLang">
      <option value="de">Deutsch</option>
      <option value="en">English</option>
    </select>
    <select id="themeSel" data-i18n-tip="tipTheme">
      <option value="red">Weiß / Rot</option>
      <option value="blue">Weiß / Blau</option>
    </select>
    <button id="soundBtn" class="ticon" data-i18n-tip="tipSound">&#128266;</button>
    <button id="fsBtn" class="ticon" data-i18n-tip="tipFullscreen">&#9974;</button>
  </div>

  <div class="presets">
    <label class="gschk" data-i18n-tip="tipGolden">
      <input type="checkbox" id="goldenChk"> <span data-i18n="goldenScore">Golden Score</span>
    </label>
    <span class="plabel" data-i18n="preset">Preset</span>
    <select id="presetSel" data-i18n-tip="tipPresetSel"></select>
    <button id="presetSave"   data-i18n="presetNew" data-i18n-tip="tipPresetNew">+ Neu</button>
    <button id="presetUpdate" data-i18n="save" data-i18n-tip="tipPresetSave">Speichern</button>
    <button id="presetRename" data-i18n="rename" data-i18n-tip="tipPresetRename">Umbenennen</button>
    <button id="presetDelete" data-i18n="delete" data-i18n-tip="tipPresetDelete">Löschen</button>
  </div>

  <div class="notch bottom">
    <button id="nextFight" class="nextbtn" data-i18n="nextFight">Nächster Kampf</button>
  </div>
  <button id="openDisp" class="openbtn" data-i18n="openDisplay">Anzeigefenster öffnen</button>

  <div id="pop" class="pop" hidden>
    <h4 id="popTitle">Edit</h4>
    <div id="popBody"></div>
    <div class="row">
      <button class="save" id="popSave" data-i18n="save">Speichern</button>
      <button class="cancel" id="popCancel" data-i18n="cancel">Abbrechen</button>
    </div>
  </div>

  <div id="help" class="help" hidden>
    <div class="helpcard">
      <h3 data-i18n="helpTitle">Tastenkürzel</h3>
      <table id="helpTable"></table>
      <button id="helpClose" data-i18n="helpClose">Schließen (Esc)</button>
    </div>
  </div>

  <script>
    /* ============================================================
       State
       ============================================================ */
    const SCORES = [
      { id: "yuko",    name: "Yuko" },
      { id: "wazaari", name: "Waza-ari" },
      { id: "ippon",   name: "Ippon" },
    ];
    const DEF = {

    let L = I18N.de;

    function loadState() {
      let saved = {};
      try { saved = JSON.parse(localStorage.getItem("judo_state") || "{}"); } catch (e) {}
      return {
        dur:   Number.isFinite(saved.dur) && saved.dur > 0 ? saved.dur : DEF.dur,
        score: Object.assign({}, DEF.score, saved.score),
        shido: Object.assign({}, DEF.shido, saved.shido),
        hist:  { white: (saved.hist && saved.hist.white) || [], red: (saved.hist && saved.hist.red) || [] },
        pts:   Object.assign({}, DEF.pts, saved.pts),
        okcfg: Object.assign({}, DEF.okcfg, saved.okcfg),
        presets:      Array.isArray(saved.presets) ? saved.presets : [],
        presetActive: saved.presetActive || null,
        theme: saved.theme === "blue" ? "blue" : "red",
        goldenScore: !!saved.goldenScore,
        sound: saved.sound !== false,
        lang: saved.lang === "en" ? "en" : "de",
        names:     { white: (saved.names && saved.names.white) || "", red: (saved.names && saved.names.red) || "" },
        nextNames: { white: (saved.nextNames && saved.nextNames.white) || "", red: (saved.nextNames && saved.nextNames.red) || "" },
        med:       { white: 0, red: 0 },
      };
    }
    const S = loadState();
    L = I18N[S.lang] || I18N.de;

    let timer = { remaining: S.dur, running: false, up: false };
    let osae  = { active: false, running: false, side: null, elapsed: 0 };
    let match = { phase: "regular", winner: null, winBy: null };   // phase: regular | golden | hantei · winBy: golden | hantei | hansoku | kiken | fusen
    let started = false;          // has this fight actually begun? (for kiken vs fusen)
    let pendingExpiry = false;    // main time ran out while osae-komi was still live
    let tLast = 0, oLast = 0;

    const other = (side) => (side === "white" ? "red" : "white");
    function declareWinner(side, by) {
      match.winner = side;
      match.winBy = by || null;
      timer.running = false;
    }
    function clearWinnerState() {
      match.winner = null;
      match.winBy = null;
    }

    /* ---- end-of-time signal ---- */
    let audioCtx = null;
    function ensureAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
      } catch (e) {}
    }
    function horn() {
      if (!S.sound) return;
      ensureAudio();
      if (!audioCtx) return;
      const t0 = audioCtx.currentTime, dur = 1.0;

      const master = audioCtx.createGain();
      master.gain.setValueAtTime(0.0001, t0);
      master.gain.exponentialRampToValueAtTime(0.55, t0 + 0.012);
      master.gain.setValueAtTime(0.55, t0 + dur - 0.16);
      master.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

      const lp = audioCtx.createBiquadFilter();
      lp.type = "lowpass"; lp.frequency.value = 1500; lp.Q.value = 0.6;
      master.connect(lp); lp.connect(audioCtx.destination);

      [[110, "square", 0.5], [165, "sawtooth", 0.3], [220, "sawtooth", 0.28], [221.6, "sawtooth", 0.2]]
        .forEach(([f, type, v]) => {
          const o = audioCtx.createOscillator();
          o.type = type; o.frequency.value = f;
          const g = audioCtx.createGain(); g.gain.value = v;
          o.connect(g); g.connect(master);
          o.start(t0); o.stop(t0 + dur);
        });
    }
    function blip() {
      ensureAudio();
      if (!audioCtx) return;
      const t0 = audioCtx.currentTime;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.14);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0); o.stop(t0 + 0.15);
    }

    /* ---- one-shot commands to the display window ---- */
    function sendCmd(cmd) {
      const msg = { type: "cmd", cmd, t: Date.now() };
      try { bc && bc.postMessage(msg); } catch (e) {}
      try { if (displayWin && !displayWin.closed) displayWin.postMessage(msg, "*"); } catch (e) {}
      try { localStorage.setItem("judo_cmd", JSON.stringify(msg)); } catch (e) {}
    }
    function toggleFullscreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
      else document.exitFullscreen().catch(() => {});
    }
    function fullscreenBoth() {
      const entering = !document.fullscreenElement;
      toggleFullscreen();
      sendCmd(entering ? "fs-on" : "fs-off");
    }

    function persist() {
      try {
        localStorage.setItem("judo_state", JSON.stringify({
          dur: S.dur, score: S.score, shido: S.shido, hist: S.hist, pts: S.pts, okcfg: S.okcfg,
          presets: S.presets, presetActive: S.presetActive, theme: S.theme, goldenScore: S.goldenScore, lang: S.lang,
          sound: S.sound, names: S.names, nextNames: S.nextNames
        }));
      } catch (e) {}
    }

    /* ============================================================
       Talking to the display window
       ============================================================ */
    let bc = null;
    try { bc = new BroadcastChannel("judo"); } catch (e) {}
    let displayWin = null;

    function okReachedId() {
      if (osae.elapsed >= S.okcfg.ippon)   return "ippon";
      if (osae.elapsed >= S.okcfg.wazaari) return "wazaari";
      if (osae.elapsed >= S.okcfg.yuko)    return "yuko";
      return null;
    }
    function snapshot() {
      return {
        type: "state",
        white: S.score.white,
        red: S.score.red,
        shido: { white: S.shido.white, red: S.shido.red },
        med: { white: S.med.white, red: S.med.red },
        timer: { remaining: timer.remaining, running: timer.running, up: timer.up },
        osae: { active: osae.active, running: osae.running, elapsed: osae.elapsed, side: osae.side, award: okReachedId() },
        match: { phase: match.phase, winner: match.winner, winBy: match.winBy },
        goldenScore: S.goldenScore,
        theme: S.theme,
        lang: S.lang,
        names: { white: S.names.white, red: S.names.red },
      };
    }
    function push() {
      const s = snapshot();
      try { bc && bc.postMessage(s); } catch (e) {}
      try { if (displayWin && !displayWin.closed) displayWin.postMessage(s, "*"); } catch (e) {}
      try { localStorage.setItem("judo_live", JSON.stringify(s)); } catch (e) {}
    }
    setInterval(push, 1000);

    window.addEventListener("message", (e) => {
      if (e.data && e.data.type === "ready") { if (e.source) displayWin = e.source; push(); }
    });
    if (bc) bc.onmessage = (e) => { if (e.data && e.data.type === "ready") push(); };

    document.getElementById("openDisp").addEventListener("click", () => {
      displayWin = window.open("display.html", "judoDisplay");
      setTimeout(push, 400);
      setTimeout(push, 1400);
    });

    /* ============================================================
       Score buttons
       ============================================================ */
    const SBTN_KEYS = {
      white: { yuko: "A", wazaari: "S", ippon: "D" },
      red:   { yuko: "J", wazaari: "K", ippon: "L" },
    };
    function renderButtons() {
      document.querySelectorAll(".scores").forEach(box => {
        const side = box.dataset.side;
        box.innerHTML = "";
        SCORES.forEach(s => {
          const b = document.createElement("button");
          b.className = "sbtn";
          b.dataset.side = side;
          b.dataset.pid = s.id;
          b.dataset.tip = L.tipScore(s.name) + " · " + L.keyWord + " " + SBTN_KEYS[side][s.id];
          b.innerHTML = '<span class="sname">' + s.name + '</span>' +
                        '<span class="spts">+' + S.pts[s.id] + '</span>';
          box.appendChild(b);
        });
      });
    }
    function sideWon(side) {
      return match.winner === side || S.score[side] >= 10;
    }
    function renderScore(side) {
      const val = S.score[side];
      document.querySelectorAll('[data-score="' + side + '"]').forEach(el => {
        el.textContent = String(val);        // the number is always shown
      });
      document.querySelectorAll('.panel[data-side="' + side + '"]').forEach(p => {
        p.classList.toggle("won",  sideWon(side));
        p.classList.toggle("lost", match.winner === other(side));
      });
    }
    function renderShido(side) {
      const n = S.shido[side];
      document.querySelectorAll('.shido[data-side="' + side + '"]').forEach(box => {
        box.querySelectorAll("i").forEach((dot, i) => dot.classList.toggle("on", i < n));
      });
    }
    function renderMed(side) {
      const n = S.med[side];
      document.querySelectorAll('.med[data-side="' + side + '"]').forEach(box => {
        box.querySelectorAll("i").forEach((dot, i) => dot.classList.toggle("on", i < n));
      });
    }
    function setMed(side, n) {
      S.med[side] = Math.max(0, Math.min(MED_MAX, n));
      renderMed(side); persist(); push();
    }
    function setShido(side, n) {
      const prev = S.shido[side];
      const now  = Math.max(0, Math.min(3, n));
      S.shido[side] = now;
      if (now > prev) started = true;
      renderShido(side);

      if (prev < 3 && now >= 3) {
        declareWinner(other(side), "hansoku");            // 3rd shido = hansoku-make
      } else if (prev >= 3 && now < 3 && match.winner === other(side) && match.winBy === "hansoku") {
        clearWinnerState();                               // 3rd shido taken back
      } else if (match.phase === "golden" && now > prev && !match.winner) {
        declareWinner(other(side), "golden");             // any shido in golden score loses
      }
      renderMatch(); persist(); push();
    }
    function hansokuMake(side) {
      if (match.winner === other(side) && match.winBy === "hansoku") clearWinnerState();
      else declareWinner(other(side), "hansoku");
      renderMatch(); persist(); push();
    }
    function kikenGachi(side) {
      const w = other(side);
      if (match.winner === w && (match.winBy === "kiken" || match.winBy === "fusen")) clearWinnerState();
      else declareWinner(w, started ? "kiken" : "fusen");   // fusen-gachi if the fight never started
      renderMatch(); persist(); push();
    }
    function hanteiPick(side) {
      if (match.phase !== "hantei") return;
      if (match.winner === side) clearWinnerState();
      else declareWinner(side, "hantei");
      renderMatch(); persist(); push();
    }
    // after time-up on points: keep the "won on points" side in sync with later corrections
    function refreshPointsWinner() {
      if (match.winBy !== "points") return;
      if (S.score.white === S.score.red) clearWinnerState();
      else declareWinner(S.score.white > S.score.red ? "white" : "red", "points");
    }

    function award(side, pts, label) {
      if (pts > 0) started = true;
      S.hist[side].push({ pts, label });
      S.score[side] = Math.max(0, S.score[side] + pts);
      if (match.phase === "golden" && !match.winner && pts > 0) {
        declareWinner(side, "golden");        // golden score: first score wins
      }
      refreshPointsWinner();
      renderMatch(); persist(); push();
    }
    function undo(side) {
      const last = S.hist[side].pop();
      if (!last) return;
      S.score[side] = Math.max(0, S.score[side] - last.pts);
      refreshPointsWinner();
      renderMatch(); persist(); push();
    }
    function resetSide(side) {
      S.hist[side] = [];
      S.score[side] = 0;
      S.shido[side] = 0;
      S.med[side]   = 0;
      if (match.winner === side || match.winner === other(side)) clearWinnerState();
      renderShido(side); renderMed(side); renderMatch(); persist(); push();
    }

    const board = document.querySelector(".board");
    const resetArmTimers = {};
    function disarmReset(btn) {
      btn.dataset.armed = "";
      btn.classList.remove("armed");
      btn.textContent = L.reset;
      clearTimeout(resetArmTimers[btn.dataset.side]);
    }
    board.addEventListener("click", (e) => {
      const fn = e.target.closest(".fname");
      if (fn) {
        const side = fn.dataset.fname;
        openEditor(L.editName, [{ key: "name", label: L.name, type: "text", value: S.names[side], allowEmpty: true }],
          (o) => { S.names[side] = o.name; renderNames(); persist(); push(); }, e.clientX, e.clientY);
        return;
      }

      const shido = e.target.closest(".shido");
      if (shido) { setShido(shido.dataset.side, S.shido[shido.dataset.side] + 1); return; }

      const med = e.target.closest(".med");
      if (med) { setMed(med.dataset.side, S.med[med.dataset.side] + 1); return; }

      const pnum = e.target.closest(".pscore");
      if (pnum) { award(pnum.dataset.score, 1, "+1"); return; }

      const sbtn = e.target.closest(".sbtn");
      if (sbtn) {
        const s = SCORES.find(x => x.id === sbtn.dataset.pid);
        award(sbtn.dataset.side, S.pts[s.id], s.name);
        return;
      }
      const btn = e.target.closest("button[data-act]");
      if (!btn) return;
      if (btn.dataset.act === "undo")    undo(btn.dataset.side);
      if (btn.dataset.act === "hansoku") hansokuMake(btn.dataset.side);
      if (btn.dataset.act === "kiken")   kikenGachi(btn.dataset.side);
      if (btn.dataset.act === "reset") {
        if (btn.dataset.armed === "1") { disarmReset(btn); resetSide(btn.dataset.side); }
        else {
          btn.dataset.armed = "1";
          btn.classList.add("armed");
          btn.textContent = L.resetArm;
          clearTimeout(resetArmTimers[btn.dataset.side]);
          resetArmTimers[btn.dataset.side] = setTimeout(() => disarmReset(btn), 3000);
        }
      }
    });

    /* ============================================================
       Editor popup
       ============================================================ */
    const pop = document.getElementById("pop");
    const popTitle = document.getElementById("popTitle");
    const popBody = document.getElementById("popBody");
    let currentSave = null;

    function openEditor(title, fields, onSave, x, y) {
      popTitle.textContent = title;
      popBody.innerHTML = "";
      const inputs = {};
      fields.forEach(f => {
        const row = document.createElement("label");
        row.className = "pf";
        row.innerHTML = "<span>" + f.label + "</span>";
        const inp = document.createElement("input");
        if (f.type === "text") {
          inp.type = "text";
          inp.value = f.value == null ? "" : f.value;
          if (f.allowEmpty) inp.dataset.allowEmpty = "1";
        } else {
          inp.type = "number";
          inp.min = String(f.min == null ? 1 : f.min);
          inp.step = "1";
          inp.value = f.value;
        }
        row.appendChild(inp);
        popBody.appendChild(row);
        inputs[f.key] = inp;
      });
      currentSave = () => {
        const out = {}; let ok = true;
        for (const k in inputs) {
          const el = inputs[k];
          if (el.type === "text") {
            const v = el.value.trim();
            if (!v && el.dataset.allowEmpty !== "1") ok = false;
            out[k] = v;
          } else {
            const v = parseInt(el.value, 10);
            const lo = parseInt(el.min || "1", 10);
            if (!Number.isFinite(v) || v < lo) ok = false;
            out[k] = v;
          }
        }
        if (ok) onSave(out);
        closePop();
      };
      pop.hidden = false;
      const w = 232, h = pop.offsetHeight || 160;
      if (x == null) { x = (window.innerWidth - w) / 2; y = (window.innerHeight - h) / 2; }
      pop.style.left = Math.max(10, Math.min(x, window.innerWidth  - w - 10)) + "px";
      pop.style.top  = Math.max(10, Math.min(y, window.innerHeight - h - 10)) + "px";
      const first = Object.values(inputs)[0];
      if (first) { first.focus(); first.select(); }
    }
    function closePop() { pop.hidden = true; currentSave = null; }
    document.getElementById("popSave").addEventListener("click", () => currentSave && currentSave());
    document.getElementById("popCancel").addEventListener("click", closePop);
    popBody.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); currentSave && currentSave(); }
      if (e.key === "Escape") closePop();
    });
    document.addEventListener("mousedown", (e) => {
      if (!pop.hidden && !pop.contains(e.target)) closePop();
    });

    board.addEventListener("contextmenu", (e) => {
      const shido = e.target.closest(".shido");
      if (shido) { e.preventDefault(); setShido(shido.dataset.side, S.shido[shido.dataset.side] - 1); return; }

      const med = e.target.closest(".med");
      if (med) { e.preventDefault(); setMed(med.dataset.side, S.med[med.dataset.side] - 1); return; }

      const pnum = e.target.closest(".pscore");
      if (pnum) {
        e.preventDefault();
        if (S.score[pnum.dataset.score] > 0) award(pnum.dataset.score, -1, "-1");
        return;
      }

      const sbtn = e.target.closest(".sbtn");
      if (!sbtn) return;
      e.preventDefault();
      const s = SCORES.find(x => x.id === sbtn.dataset.pid);
      openEditor(L.pointsOf(s.name), [{ key: "pts", label: L.points, value: S.pts[s.id] }],
        (o) => { S.pts[s.id] = o.pts; markCustom(); renderButtons(); persist(); }, e.clientX, e.clientY);
    });

    /* ============================================================
       Osae-komi timer (counts up)
       ============================================================ */
    const oktimeBox = document.getElementById("oktime");
    const okElapsedEl = document.getElementById("okElapsed");
    const okAwardEl = document.getElementById("okAward");

    const okStartBtn = document.getElementById("okStart");

    function okRender() {
      okElapsedEl.textContent = Math.floor(osae.elapsed);
      const id = okReachedId();
      okAwardEl.textContent = (osae.active && id)
        ? SCORES.find(s => s.id === id).name.toUpperCase() : "";

      oktimeBox.className = "oktime"
        + (osae.running ? " run" : (osae.active ? " paused" : ""))
        + (osae.side ? " " + osae.side : "");

      const armed = osae.active && !osae.side;
      document.querySelectorAll(".okarrow").forEach(b => {
        b.classList.toggle("armed", armed);
        b.classList.toggle("active", osae.side === b.dataset.side);
        b.disabled = !osae.active;
      });

      // the clock + arrows only appear while a hold is running, but their
      // space is always reserved so the notch never changes height
      document.querySelector(".okrow").classList.toggle("live", osae.active);
      okStartBtn.classList.toggle("gone", osae.active);
    }

    function okStart() {
      if (match.winner) return;
      osae = { active: true, running: true, side: null, elapsed: 0 };
      started = true;
      oLast = performance.now();
      okRender(); push();
    }
    function okAssign(side) {
      if (!osae.active) return;
      osae.side = side;
      // main time already over, or hold already maxed: score it right away
      if (pendingExpiry || osae.elapsed >= S.okcfg.ippon) { okFinish(true); return; }
      okRender(); push();
    }
    function okClockClick() {
      if (!osae.active) return;
      if (!osae.side) {
        if (pendingExpiry) return;             // time is up – the hold clock stays frozen
        osae.running = !osae.running;          // before assigning: pause / resume
        if (osae.running) oLast = performance.now();
        okRender(); push();
      } else {
        okFinish(true);                        // after assigning: stop & score
      }
    }
    function okFinish(doAward) {
      const id = okReachedId();
      const side = osae.side;
      if (doAward && id && side) {
        const s = SCORES.find(x => x.id === id);
        award(side, S.pts[id], "Osae-komi " + s.name);
      }
      osae = { active: false, running: false, side: null, elapsed: 0 };
      okRender(); push();
      if (pendingExpiry) { pendingExpiry = false; onTimeExpired(); }   // time ran out during the hold
    }
    function okTick() {
      if (!osae.running) return;
      const now = performance.now();
      osae.elapsed += (now - oLast) / 1000;
      oLast = now;
      if (osae.elapsed >= S.okcfg.ippon) {
        osae.elapsed = S.okcfg.ippon;
        if (osae.side) { okFinish(true); return; }
        osae.running = false;                  // freeze at max, wait for a side
      }
      okRender(); push();
    }
    setInterval(okTick, 100);

    okStartBtn.addEventListener("click", okStart);
    document.getElementById("okCancel").addEventListener("click", () => okFinish(false));
    document.querySelectorAll(".okarrow").forEach(b =>
      b.addEventListener("click", () => okAssign(b.dataset.side)));
    oktimeBox.addEventListener("click", okClockClick);

    oktimeBox.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      openEditor(L.okThresholds, [
        { key: "yuko",    label: "Yuko",     value: S.okcfg.yuko },
        { key: "wazaari", label: "Waza-ari", value: S.okcfg.wazaari },
        { key: "ippon",   label: "Ippon",    value: S.okcfg.ippon },
      ], (o) => { S.okcfg = o; markCustom(); persist(); okRender(); }, e.clientX, e.clientY);
    });

    /* ============================================================
       Main timer
       ============================================================ */
    const timerEl = document.getElementById("timer");
    function fmt(sec) {
      sec = Math.max(0, Math.ceil(sec));
      return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
    }
    function timerRender() {
      timerEl.textContent = fmt(timer.remaining);
      if (match.phase === "golden") {
        timerEl.className = "timer golden";
      } else {
        timerEl.className = "timer " + (timer.remaining <= 0 ? "done" : (timer.running ? "running" : "stopped"));
      }
    }
    function timerTick() {
      if (!timer.running) return;
      const now = performance.now();
      const dt = (now - tLast) / 1000;
      tLast = now;
      if (timer.up) {
        timer.remaining += dt;                 // golden score: count up, no limit
      } else {
        timer.remaining -= dt;
        if (timer.remaining <= 0) {
          timer.remaining = 0;
          timer.running = false;
          timerRender(); push();
          horn();                              // buzzer at time-up
          if (osae.active) {
            osae.running = false;              // freeze the osae-komi clock at time-up
            pendingExpiry = true;              // the frozen hold still gets finished / scored
            okRender();
          } else {
            onTimeExpired();
          }
          return;
        }
      }
      timerRender(); push();
    }
    function toggleTimer() {
      if (match.winner) return;
      if (!timer.up && timer.remaining <= 0) return;
      timer.running = !timer.running;
      if (timer.running) { started = true; ensureAudio(); }
      tLast = performance.now();
      timerRender(); push();
    }
    function resetTimer() {
      match = { phase: "regular", winner: null, winBy: null };
      timer = { remaining: S.dur, running: false, up: false };
      started = false;
      pendingExpiry = false;
      renderMatch(); timerRender(); push();
    }

    function fitName(el) {
      el.style.fontSize = "";
      const base = parseFloat(getComputedStyle(el).fontSize);
      let size = base, guard = 40;
      while (el.scrollWidth > el.clientWidth + 1 && size > 8 && guard-- > 0) {
        size -= 1;
        el.style.fontSize = size + "px";
      }
    }
    function renderNames() {
      const w = document.querySelector('[data-fname="white"]');
      const r = document.querySelector('[data-fname="red"]');
      w.textContent = S.names.white || L.fighter1;
      r.textContent = S.names.red   || L.fighter2;
      fitName(w); fitName(r);
    }
    window.addEventListener("resize", renderNames);

    /* ---- match phase: golden score / hantei ---- */
    function renderMatch() {
      const golden = match.phase === "golden";
      document.body.classList.toggle("golden", golden);

      document.getElementById("hantei").hidden = match.phase !== "hantei";
      document.querySelectorAll(".harrow").forEach(b =>
        b.classList.toggle("chosen", match.winner === b.dataset.side));

      const pl = document.getElementById("phaseLabel");
      if (match.winBy === "hansoku")     pl.textContent = L.phaseHansoku;
      else if (match.winBy === "kiken")  pl.textContent = L.phaseKiken;
      else if (match.winBy === "fusen")  pl.textContent = L.phaseFusen;
      else if (golden)                  pl.textContent = L.phaseGolden;
      else if (match.phase === "hantei") pl.textContent = L.phaseHantei;
      else                              pl.textContent = "";

      renderScore("white");
      renderScore("red");
    }
    function onTimeExpired() {
      if (match.phase !== "regular") return;
      if (S.score.white !== S.score.red) {
        // time up with a points lead → that fighter wins
        declareWinner(S.score.white > S.score.red ? "white" : "red", "points");
        renderMatch(); timerRender(); push();
        return;
      }
      if (S.goldenScore) {
        match.phase = "golden";
        timer = { remaining: 0, running: false, up: true };
      } else {
        match.phase = "hantei";
      }
      renderMatch(); timerRender(); push();
    }

    timerEl.addEventListener("click", toggleTimer);
    timerEl.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      openEditor(L.matchTime, [
        { key: "min", label: L.minutes, value: Math.floor(S.dur / 60), min: 0 },
        { key: "sec", label: L.seconds, value: S.dur % 60, min: 0 },
      ], (o) => {
        const total = o.min * 60 + o.sec;
        if (total < 1) return;
        S.dur = total;
        if (!timer.running) timer.remaining = S.dur;
        markCustom(); persist(); timerRender(); push();
      }, e.clientX, e.clientY);
    });
    /* keyboard: white = a s d (+ shido q, undo w) · red = j k l (+ shido p, undo o) */
    const SCOREKEYS = {
      a: ["white", "yuko"], s: ["white", "wazaari"], d: ["white", "ippon"],
      j: ["red", "yuko"],   k: ["red", "wazaari"],   l: ["red", "ippon"],
    };

    /* ---- keyboard-shortcut overview (press ?) ---- */
    const SHORTCUTS = [
      { k: "Leertaste", de: "Timer Start / Stopp",               en: "Timer start / stop" },
      { k: "R",         de: "Timer zurücksetzen",                 en: "Reset timer" },
      { k: "M",         de: "Osae-komi starten / stoppen",        en: "Osae-komi start / stop" },
      { k: "N",         de: "Nächster Kampf",                     en: "Next fight" },
      { k: "F",         de: "Vollbild (beide Fenster)",           en: "Fullscreen (both windows)" },
      { k: "A / S / D", de: "Weiß: Yuko / Waza-ari / Ippon",      en: "White: Yuko / Waza-ari / Ippon" },
      { k: "J / K / L", de: "Rot: Yuko / Waza-ari / Ippon",       en: "Red: Yuko / Waza-ari / Ippon" },
      { k: "Q / P",     de: "Shido Weiß / Rot",                   en: "Shido white / red" },
      { k: "W / O",     de: "Rückgängig Weiß / Rot",              en: "Undo white / red" },
      { k: "← / →", de: "Hantei-Sieger · bzw. Osae-komi-Seite", en: "Hantei winner · or osae-komi side" },
      { k: "1 – 9", de: "Preset wählen",                     en: "Select preset" },
      { k: "?",         de: "Diese Übersicht",                    en: "This overview" },
    ];
    const helpEl = document.getElementById("help");
    function renderHelp() {
      document.getElementById("helpTable").innerHTML = SHORTCUTS.map(sc =>
        "<tr><td>" + sc.k + "</td><td>" + (S.lang === "en" ? sc.en : sc.de) + "</td></tr>").join("");
    }
    function toggleHelp(force) {
      const show = force === undefined ? helpEl.hidden : force;
      if (show) renderHelp();
      helpEl.hidden = !show;
    }
    helpEl.addEventListener("click", (e) => { if (e.target === helpEl) toggleHelp(false); });
    document.getElementById("helpClose").addEventListener("click", () => toggleHelp(false));

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !helpEl.hidden) { toggleHelp(false); return; }
      if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === "?") { e.preventDefault(); toggleHelp(); return; }
      ensureAudio();
      const k = e.key.toLowerCase();

      if (e.code === "Space") { e.preventDefault(); toggleTimer(); return; }
      if (k === "r") { resetTimer(); return; }
      if (k === "f") { e.preventDefault(); fullscreenBoth(); return; }
      if (k === "m") { e.preventDefault(); if (!osae.active) okStart(); else okClockClick(); return; }
      if (k === "n") { e.preventDefault(); document.getElementById("nextFight").click(); return; }

      if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
        const side = e.key === "ArrowLeft" ? "white" : "red";
        if (osae.active && !osae.side) { e.preventDefault(); okAssign(side); }
        else if (match.phase === "hantei") { e.preventDefault(); hanteiPick(side); }
        return;
      }

      if (SCOREKEYS[k]) {
        const [side, id] = SCOREKEYS[k];
        e.preventDefault();
        award(side, S.pts[id], SCORES.find(x => x.id === id).name);
        return;
      }
      if (k === "q") { e.preventDefault(); setShido("white", S.shido.white + 1); return; }
      if (k === "p") { e.preventDefault(); setShido("red",   S.shido.red   + 1); return; }
      if (k === "w") { e.preventDefault(); undo("white"); return; }
      if (k === "o") { e.preventDefault(); undo("red");   return; }

      if (/^[1-9]$/.test(e.key)) {
        const p = S.presets[Number(e.key) - 1];
        if (p) { e.preventDefault(); applyPreset(p.id); }
      }
    });
    setInterval(timerTick, 200);

    /* hantei arrows + golden-score toggle */
    document.querySelectorAll(".harrow").forEach(b =>
      b.addEventListener("click", () => hanteiPick(b.dataset.side)));

    const goldenChk = document.getElementById("goldenChk");
    goldenChk.checked = S.goldenScore;
    goldenChk.addEventListener("change", () => {
      S.goldenScore = goldenChk.checked;
      persist(); push();
    });

    /* ============================================================
       Presets (control only) – bundle match time + points + thresholds
       ============================================================ */
    const presetSel = document.getElementById("presetSel");

    function markCustom() {
      if (S.presetActive !== null) { S.presetActive = null; renderPresets(); }
    }

    function renderPresets() {
      presetSel.innerHTML = "";
      if (!S.presets.length) {
        const o = document.createElement("option");
        o.value = ""; o.textContent = L.noPresets;
        presetSel.appendChild(o);
      } else {
        if (!S.presetActive) {
          const o = document.createElement("option");
          o.value = ""; o.textContent = L.custom; o.selected = true;
          presetSel.appendChild(o);
        }
        S.presets.forEach((p, i) => {
          const o = document.createElement("option");
          o.value = p.id; o.textContent = (i < 9 ? (i + 1) + ". " : "") + p.name;
          if (p.id === S.presetActive) o.selected = true;
          presetSel.appendChild(o);
        });
      }
      const sel = !!S.presetActive;
      document.getElementById("presetUpdate").disabled = !sel;
      document.getElementById("presetRename").disabled = !sel;
      document.getElementById("presetDelete").disabled = !sel;
    }

    function applyPreset(id) {
      const p = S.presets.find(x => x.id === id);
      if (!p) return;
      S.dur   = p.dur;
      S.pts   = Object.assign({}, DEF.pts, p.pts);
      S.okcfg = Object.assign({}, DEF.okcfg, p.okcfg);
      S.presetActive = id;
      if (!timer.running) timer.remaining = S.dur;
      renderButtons(); okRender(); timerRender();
      renderPresets(); persist(); push();
    }

    function newPresetId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    presetSel.addEventListener("change", (e) => {
      if (e.target.value) applyPreset(e.target.value);
    });

    document.getElementById("presetSave").addEventListener("click", () => {
      openEditor(L.newPreset, [{ key: "name", label: L.name, type: "text", value: "" }], (o) => {
        const id = newPresetId();
        S.presets.push({
          id, name: o.name,
          dur: S.dur,
          pts: Object.assign({}, S.pts),
          okcfg: Object.assign({}, S.okcfg),
        });
        S.presetActive = id;
        renderPresets(); persist();
      });
    });

    document.getElementById("presetUpdate").addEventListener("click", () => {
      const p = S.presets.find(x => x.id === presetSel.value);
      if (!p) return;
      p.dur = S.dur;
      p.pts = Object.assign({}, S.pts);
      p.okcfg = Object.assign({}, S.okcfg);
      S.presetActive = p.id;
      renderPresets(); persist();
    });

    document.getElementById("presetRename").addEventListener("click", () => {
      const p = S.presets.find(x => x.id === presetSel.value) || S.presets[0];
      if (!p) return;
      openEditor(L.renamePreset, [{ key: "name", label: L.name, type: "text", value: p.name }], (o) => {
        p.name = o.name;
        renderPresets(); persist();
      });
    });

    document.getElementById("presetDelete").addEventListener("click", () => {
      const idx = S.presets.findIndex(x => x.id === presetSel.value);
      const target = idx >= 0 ? idx : (S.presets.length ? 0 : -1);
      if (target < 0) return;
      const removed = S.presets.splice(target, 1)[0];
      if (S.presetActive === removed.id) S.presetActive = null;
      renderPresets(); persist();
    });

    /* ============================================================
       Next fight – reset timer, scores and penalties
       ============================================================ */
    function renderNextQueue() {
      const btn = document.getElementById("nextFight");
      const q = S.nextNames.white || S.nextNames.red;
      btn.classList.toggle("queued", !!q);
      let tip = L.tipNextFight + " · " + L.keyWord + " N";
      if (q) tip += " · " + L.nextQueued + ": " + (S.nextNames.white || "–") + " / " + (S.nextNames.red || "–");
      btn.dataset.tip = tip;
    }
    function nextFight() {
      if (S.nextNames.white || S.nextNames.red) {
        S.names = { white: S.nextNames.white, red: S.nextNames.red };
        S.nextNames = { white: "", red: "" };
      }
      S.score.white = 0; S.score.red = 0;
      S.shido.white = 0; S.shido.red = 0;
      S.med.white = 0;   S.med.red = 0;
      S.hist.white = []; S.hist.red = [];
      osae = { active: false, running: false, side: null, elapsed: 0 };
      match = { phase: "regular", winner: null, winBy: null };
      timer = { remaining: S.dur, running: false, up: false };
      started = false;
      pendingExpiry = false;
      persist();
      renderScore("white"); renderScore("red");
      renderShido("white"); renderShido("red");
      renderMed("white"); renderMed("red");
      renderNames(); renderNextQueue();
      renderMatch(); okRender(); timerRender(); push();
    }
    (function () {
      const btn = document.getElementById("nextFight");
      let armed = false, t = null;
      window.disarmNextFight = () => {   // called by applyLang so the label follows the language
        clearTimeout(t); armed = false;
        btn.classList.remove("armed"); btn.textContent = L.nextFight;
      };
      btn.addEventListener("click", () => {
        if (!armed) {
          armed = true;
          btn.classList.add("armed");
          btn.textContent = L.nextFightArm;
          t = setTimeout(() => { armed = false; btn.classList.remove("armed"); btn.textContent = L.nextFight; }, 3000);
          return;
        }
        clearTimeout(t); armed = false;
        btn.classList.remove("armed"); btn.textContent = L.nextFight;
        nextFight();
      });
      btn.addEventListener("contextmenu", (e) => {
        e.preventDefault();
        openEditor(L.editNextNames, [
          { key: "white", label: L.sideWhite, type: "text", value: S.nextNames.white, allowEmpty: true },
          { key: "red",   label: L.sideRed,   type: "text", value: S.nextNames.red,   allowEmpty: true },
        ], (o) => { S.nextNames = { white: o.white, red: o.red }; renderNextQueue(); persist(); }, e.clientX, e.clientY);
      });
    })();

    /* ============================================================
       Theme (White/Red vs White/Blue)
       ============================================================ */
    const themeSel = document.getElementById("themeSel");
    function applyTheme() {
      document.body.dataset.theme = S.theme;
      themeSel.value = S.theme;
    }
    themeSel.addEventListener("change", (e) => {
      S.theme = e.target.value === "blue" ? "blue" : "red";
      applyTheme(); persist(); push();
    });

    /* ============================================================
       Language (German / English)
       ============================================================ */
    const langSel = document.getElementById("langSel");
    function applyLang() {
      L = I18N[S.lang] || I18N.de;
      document.documentElement.lang = S.lang;
      langSel.value = S.lang;

      document.querySelectorAll("[data-i18n]").forEach(el => {
        const v = L[el.dataset.i18n];
        if (typeof v === "string") el.textContent = v;
      });
      document.querySelectorAll("[data-i18n-tip]").forEach(el => {
        const v = L[el.dataset.i18nTip];
        if (typeof v !== "string") return;
        el.dataset.tip = el.dataset.key ? (v + " · " + L.keyWord + " " + el.dataset.key) : v;
      });

      themeSel.options[0].textContent = L.themeRed;
      themeSel.options[1].textContent = L.themeBlue;

      if (window.disarmNextFight) window.disarmNextFight();
      renderNames();
      renderButtons();
      renderPresets();
      renderMatch();
      renderNextQueue();
      if (!helpEl.hidden) renderHelp();
    }
    langSel.addEventListener("change", (e) => {
      S.lang = e.target.value === "en" ? "en" : "de";
      applyLang(); persist(); push();
    });

    /* ============================================================
       Sound toggle + fullscreen (both windows)
       ============================================================ */
    const soundBtn = document.getElementById("soundBtn");
    function renderSound() {
      soundBtn.textContent = S.sound ? "\u{1F50A}" : "\u{1F507}";
      soundBtn.classList.toggle("off", !S.sound);
    }
    soundBtn.addEventListener("click", () => {
      S.sound = !S.sound;
      renderSound(); persist();
      if (S.sound) { ensureAudio(); blip(); }
    });
    document.getElementById("fsBtn").addEventListener("click", fullscreenBoth);

    /* ============================================================
       Initial paint
       ============================================================ */
    renderButtons();
    renderScore("white");
    renderScore("red");
    renderShido("white");
    renderShido("red");
    renderMed("white");
    renderMed("red");
    renderPresets();
    renderSound();
    applyTheme();
    applyLang();          // also renders names + buttons + match + next-fight queue
    okRender();
    timerRender();
    push();
  </script>
</body>
</html>
